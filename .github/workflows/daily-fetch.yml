name: 每日热销数据抓取

on:
  schedule:
    # UTC 22:00 = 北京时间 06:00，每天自动跑一次
    - cron: '0 22 * * *'
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取今日热销数据（单个平台失败自动回退模拟数据）
        run: python scripts/fetch_hot.py

      - name: 把数据提交回仓库
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 更新每日热销数据 $(date +%F)"
          commit_user_name: "hot-bot"
          commit_user_email: "hot-bot@users.noreply.github.com"
          file_pattern: "data/*.json"
